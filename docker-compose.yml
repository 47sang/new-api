# New-API Docker Compose Configuration
#
# 数据库使用 SQLite（单文件，落在 new-api-data/data/），不依赖 PostgreSQL/MySQL。
# 业务参数通过项目根目录的 .env 文件注入（env_file），修改后需 docker compose up -d 重建容器生效。
#
# Quick Start:
#   1. docker compose up -d
#   2. Access at http://localhost:3000

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    image: new-api:local
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - /Users/zhou/Desktop/ai-agent-lab/new-api-data:/data
      - /Users/zhou/Desktop/ai-agent-lab/new-api-data/logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      # 覆盖 .env 里的 SQLITE_PATH（宿主机绝对路径在容器内无效），指向挂载卷 /data
      # 注意 SQLITE_PATH 是完整 DSN，必须带上默认的 pragma 参数（见 common/database.go）
      - SQLITE_PATH=/data/sqlite.db?_pragma=busy_timeout(30000)&_pragma=journal_mode(WAL)&_txlock=immediate
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=new-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
      - REDIS_CONN_STRING=redis://:123456@redis:6379 # ⚠️ IMPORTANT: Change this password in production!

    depends_on:
      - redis
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine # 本地已有该镜像，避免 docker-compose 拉取 redis:latest 触发 Docker Hub 网络超时
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ IMPORTANT: Change this password in production!
    networks:
      - new-api-network

networks:
  new-api-network:
    driver: bridge
